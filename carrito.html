<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"

        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="./assets/css/style.css">

    <script defer src="./assets/js/script.js"></script>

</head>

<body>
    <nav class="navbar navbar-expand-lg bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Store</a>
            <button class="navbar-toggler bg-danger" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#seccion-productos">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="carrito.html">Carrito</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <header class="py-3">
        <h1 class="text-center">Detalles de tu carrito:</h1>
    </header>
    <main>
        <section class="detalle-carrito text-danger">
            <table class="table table-dark">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">imagen</th>
                        <th scope="col">Precio</th>
                        <th scope="col">Modelo</th>
                        <th scope="col">Cantidad</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1.-</td>
                        <td>Producto 1</td>
                        <td>
                            <div>
                                <img class="img-fluid" src="./assets/img/recortada-windu.jpg" alt="Producto 6"
                                    width="80px">
                            </div>
                        </td>
                        <td>$4.500</td>
                        <td>Mod 6</td>
                        <td>
                            <input class="cant" type="number" min="1" max="10">
                        </td>
                        <td>
                            <button class="btn btn-danger btn-eliminar">Eliminar
                                <i class="bi bi-trash3"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="d-flex justify-content-end py-2">
                <button class="btn btn-primary">Ir a pagar</button>
            </div>
        </section>
    </main>
    <hr>
    <footer class="py-5">
        <p class="text-center">Proyecto desarrollado por César Ortega.
            <br>
            <strong>Los elementos intelectuales y artisticos son propiedad de Disney</strong>
            <br> <em>Noviembre 2025</em>
        </p>
    </footer>
